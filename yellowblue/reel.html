<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--k)}
.sc{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:230px 120px 480px}
.sc.on{display:flex}
.sc.y{background:var(--y);color:var(--bd)} .sc.b{background:var(--b);color:var(--w)} .sc.k{background:var(--k);color:var(--y)}
.big{font-weight:900;font-size:190px;line-height:1.3;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.mid{font-weight:900;font-size:120px;line-height:1.3;animation:pop .35s .15s cubic-bezier(.2,1.6,.4,1) both}
.sm{font-weight:600;font-size:64px;margin-top:40px;animation:up .5s .35s both}
.hl{background:var(--y);color:var(--bd);padding:0 .2em;border-radius:20px;display:inline-block;line-height:1.35;margin-top:24px}
.y .hl{background:var(--b);color:var(--ys)}
.row{display:flex;gap:40px;align-items:center;direction:rtl;margin-top:70px}
.card{width:380px;border-radius:50px;padding:60px 20px;background:rgba(245,246,250,.14);animation:pop .4s both}
.card.a{background:var(--y);color:var(--bd);animation-delay:.5s}
.card small{display:block;font-size:50px;font-weight:600}.card strong{font-size:170px;font-weight:900;direction:ltr;display:block}
.ar{font-size:120px;font-weight:900}
.bar{position:absolute;top:0;left:0;height:14px;background:var(--y);width:0}
.top{position:absolute;top:100px;right:80px;z-index:5}
.top img{height:110px;border-radius:18px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.note{position:absolute;bottom:430px;left:0;right:0;text-align:center;font-size:34px;font-weight:600;color:var(--w);opacity:.75;z-index:6;direction:rtl}
</style></head><body>
<div class="top" id="top"><img src="assets/logo.jpg"></div><div class="bar" id="bar"></div>
<div class="sc y" data-t="0"><div class="big" style="font-size:230px"><span style="direction:ltr;display:inline-block">248</span><br>متابع بس.</div></div>
<div class="sc k" data-t="3"><div class="mid">ونحن وكالة<br><span class="hl">إعلان.</span></div></div>
<div class="sc b" data-t="6"><div class="mid">قررنا نوثّق<br>الرحلة <span class="hl">قدامك.</span></div></div>
<div class="sc y" data-t="9"><div class="sm" style="margin:0 0 20px">أفضل ريل عندنا</div><div class="big" style="font-size:200px"><span style="direction:ltr;display:inline-block">206</span></div><div class="mid">مشاهدة.</div></div>
<div class="sc b" data-t="13"><div class="mid">ومعظم ريلزنا الأخيرة<br>ما تعدّت <span class="hl" style="direction:ltr">40</span></div></div>
<div class="sc k" data-t="17"><div class="mid">كل أسبوع:<br>الأرقام الحقيقية.</div><div class="sm">اللي نجح، واللي فشل.</div></div>
<div class="sc y" data-t="21"><div class="mid">تبي تتابع<br>الرحلة؟</div><div class="big hl" style="font-size:120px;margin-top:50px;padding:10px 60px">تابعنا</div><div class="sm" style="direction:ltr">@yellow.blue.om</div></div>
<div class="sc b" data-t="24"><div class="big" style="font-size:200px"><span class="hl" style="direction:ltr">248</span></div><div class="mid">لين الحين.</div></div>
<div class="note">الأرقام من حساب @yellow.blue.om بتاريخ 2 نوفمبر 2026</div>
<script>
const sc=[...document.querySelectorAll('.sc')],END=27;let t0=null;
function tick(ts){if(t0===null)t0=ts;const t=(ts-t0)/1000;let cur=-1;
 sc.forEach((s,i)=>{if(t>=+s.dataset.t)cur=i});
 sc.forEach((s,i)=>{const on=i===cur;if(on&&!s.classList.contains('on')){s.classList.add('on')}else if(!on&&s.classList.contains('on')){s.classList.remove('on')}});
  document.getElementById('bar').style.width=Math.min(100,t/END*100)+'%';
 window.__t=t;if(t<END+.5)requestAnimationFrame(tick);else window.__done=true}
requestAnimationFrame(tick);
</script></body></html>
