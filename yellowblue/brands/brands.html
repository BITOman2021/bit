<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">

</style></head><body><div id="st"><canvas id="c" width="1080" height="1920"></canvas><div id="ov"></div></div>
<script>

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3),ioc=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ob=x=>{const c=2.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

const vis=(e,o,tx='',b=0)=>{e.style.opacity=o;e.style.transform=tx;e.style.filter=b>.1?`blur(${b}px)`:'none'};
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
let R,DUR;
if(V==='m'){ // MASIYA jewellery
 DUR=14;
 const wm=T('ماسّية','top:1000px;font-family:Amiri;font-weight:700;color:#EBDCBC;line-height:1.2',230);
 const lt=T('MASIYA · FINE JEWELLERY','top:1250px;color:#C98B7B;font-weight:600',48);lt.classList.add('lat');
 const tg=T('الضوء يعرفها.','top:1400px;font-family:Amiri;color:#F3E9D2',100);
 const cta=T('اكتشفي المجموعة','top:1560px;font-family:Plex;font-weight:600;color:#EBDCBC;border:2px solid #C98B7B;display:inline-block;left:50%;right:auto;transform:translateX(-50%);padding:14px 60px;border-radius:999px',46);
 const P=[];for(let i=0;i<90;i++)P.push({x:rnd()*1080,y:rnd()*1920,p:rnd()*6.28,s:rnd()});
 const dark=[22,18,34],ice=[236,244,255],rose=[201,139,123];
 function gem(cx,cy,Rr,rot,L,t){
  const pt=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r*0.96];
  const O=[],M=[],Tb=[];for(let i=0;i<8;i++){O.push(pt(rot+i*Math.PI/4,Rr));M.push(pt(rot+Math.PI/8+i*Math.PI/4,Rr*.66));Tb.push(pt(rot+i*Math.PI/4,Rr*.36))}
  const tri=(p,q,r,ang,k)=>{const lit=Math.pow(Math.max(0,Math.cos(ang-L)),2);const b=cl(.12+.78*lit+.12*Math.sin(k*2.7+t*.8),0,1);const col=mix(mix(dark,rose,.18+.1*Math.sin(k)),ice,b);g.beginPath();g.moveTo(...p);g.lineTo(...q);g.lineTo(...r);g.closePath();g.fillStyle=`rgb(${col})`;g.fill();g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=1.5;g.stroke();};
  for(let i=0;i<8;i++){const j=(i+1)%8,h=(i+7)%8;const a0=rot+i*Math.PI/4,a1=a0+Math.PI/8,a2=a0-Math.PI/8;
   tri(Tb[i],Tb[j],M[i],a1,i*4+1);tri(Tb[i],M[h],M[i],a0-.0,i*4+2);tri(O[i],M[h],M[i],a2,i*4+3);tri(O[i],O[j],M[i],a1,i*4+4);}
  g.beginPath();Tb.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();const tb=.35+.55*Math.pow(Math.max(0,Math.cos(L-rot-.4)),2);g.fillStyle=`rgb(${mix(dark,ice,tb)})`;g.fill();g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  for(let i=0;i<8;i++){const a=rot+i*Math.PI/4;const k=Math.pow(Math.max(0,Math.cos(a-L)),24);if(k>.15)star(O[i][0],O[i][1],70+120*k,k)}
 }
 function star(x,y,s,k){g.save();g.globalCompositeOperation='lighter';g.translate(x,y);const gr=g.createRadialGradient(0,0,0,0,0,s*.7);gr.addColorStop(0,`rgba(255,255,255,${.9*k})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,s*.7,0,6.28);g.fill();g.strokeStyle=`rgba(255,255,255,${.85*k})`;g.lineWidth=2.5;g.beginPath();g.moveTo(-s,0);g.lineTo(s,0);g.moveTo(0,-s);g.lineTo(0,s);g.stroke();g.restore()}
 DUR=14;R=t=>{
  const bg=g.createRadialGradient(540,700,50,540,800,1300);bg.addColorStop(0,'#1d1628');bg.addColorStop(1,'#07050b');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  g.save();g.globalCompositeOperation='lighter';for(const p of P){const a=(.15+.5*Math.abs(Math.sin(t*1.4+p.p)))*p.s;g.fillStyle=`rgba(235,220,188,${a})`;g.beginPath();g.arc(p.x,(p.y-t*20*p.s+1920*3)%1920,1+p.s*2.4,0,6.28);g.fill()}g.restore();
  const s=.12+.88*ioc(seg(t,0,3.4)),shift=ioc(seg(t,5,6.6));const cy=820-shift*190,sc=s*(1-.26*shift);
  g.globalAlpha=cl(t/.8);gem(540,cy,360*sc,t*.22,t*1.15,t);g.globalAlpha=1;
  const f=seg(t,3.0,3.5);if(f>0&&f<1)star(540,cy,900*Math.sin(f*Math.PI),Math.sin(f*Math.PI));
  vis(wm,oc(seg(t,6.2,7.4)),`translateY(${(1-oc(seg(t,6.2,7.4)))*40}px)`,(1-oc(seg(t,6.2,7.4)))*14);
  vis(lt,oc(seg(t,7.0,8.0)));vis(tg,oc(seg(t,8.4,9.6)),`translateY(${(1-oc(seg(t,8.4,9.6)))*30}px)`,(1-oc(seg(t,8.4,9.6)))*12);
  vis(cta,oc(seg(t,11,12)));vis(cr,.45);
  st.style.opacity=seg(t,0,.4)*(1-seg(t,13.5,14));};
}
if(V==='l'){ // LAHZA watches
 DUR=14;
 const words=['اثنا عشر','فجر','قهوة','سفر','لقاء','ضحكة','صمت','غروب','عائلة','وعد','بداية','ليل'];
 const cx=540,cy=760,Rr=410;
 const W=words.map((w,i)=>{const a=-Math.PI/2+i*Math.PI/6;const e=T(w,`top:${cy+Math.sin(a)*312-30}px;left:${cx+Math.cos(a)*312-130}px;right:auto;width:260px;font-family:Reem;font-weight:700;color:#B8924A`,50);return e});
 W[0].textContent='١٢';W[0].style.fontFamily='Corm';
 const m1=T('الوقت لا يُلبَس.','top:1260px;font-family:Reem;font-weight:700;color:#F1E9D6',108);
 const m2=T('اللحظة تُلبَس.','top:1260px;font-family:Reem;font-weight:700;color:#B8924A',116);
 const wm=T('لحظة','top:1230px;font-family:Reem;font-weight:700;color:#B8924A;line-height:1.1',190);
 const lt=T('LAHZA · ATELIER','top:1470px;color:#F1E9D6;font-weight:600',50);lt.classList.add('lat');
 const cta=T('اكتشف الإصدارات','top:1610px;font-family:Plex;font-weight:600;color:#F1E9D6;border:2px solid #B8924A;display:inline-block;left:50%;right:auto;transform:translateX(-50%);padding:14px 60px;border-radius:999px',46);
 const st0=2.0,gap=.5;
 R=t=>{
  const bg=g.createRadialGradient(540,700,50,540,800,1300);bg.addColorStop(0,'#15201a');bg.addColorStop(1,'#070b09');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  const rp=oc(seg(t,.1,1.8));g.lineWidth=5;g.strokeStyle='#B8924A';g.beginPath();g.arc(cx,cy,Rr,-Math.PI/2,-Math.PI/2+6.2832*rp);g.stroke();
  g.lineWidth=2;g.strokeStyle='rgba(241,233,214,.25)';g.beginPath();g.arc(cx,cy,Rr-26,0,6.2832);g.stroke();
  for(let i=0;i<60;i++){const a=-Math.PI/2+i*Math.PI/30,k=oc(seg(t,.5+i*.012,1.6+i*.012));const big=i%5===0;const r0=Rr-(big?60:36),r1=Rr-12;g.lineWidth=big?4:2;g.strokeStyle=big?'#B8924A':'rgba(241,233,214,.45)';g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a)*(r0+(r1-r0)*k),cy+Math.sin(a)*(r0+(r1-r0)*k));g.stroke()}
  // words
  W.forEach((e,i)=>{const jm=(2*i)%24;let hit=-9;for(let j=jm||24;j<=24*3;j+=24){const tj=st0+(j-1)*gap;if(tj<=t)hit=tj}
   const b=cl(1-(t-hit)/1.3,0,1);e.style.opacity=oc(seg(t,1.0+i*.07,1.8+i*.07))*(.45+.55*b);e.style.color=b>0?`rgb(${mix([184,146,74],[255,236,190],b)})`:'#B8924A';e.style.transform=`scale(${1+.18*b})`;});
  // hands
  const nstep=cl(Math.floor((t-st0)/gap)+1,0,999),tk=st0+(nstep-1)*gap;let ang=-Math.PI/2;if(t>=st0){const p=seg(t,tk,tk+.16);ang=-Math.PI/2+((nstep-1)+ob(p))*Math.PI/12}
  const hr=-Math.PI/2+(t/14)*.5;
  g.lineCap='round';g.strokeStyle='#F1E9D6';g.lineWidth=14;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(hr)*190,cy+Math.sin(hr)*190);g.stroke();
  g.lineWidth=9;const mr=-Math.PI/2+(t/14)*3.1;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(mr)*270,cy+Math.sin(mr)*270);g.stroke();
  g.strokeStyle='#B8924A';g.lineWidth=4;g.beginPath();g.moveTo(cx-Math.cos(ang)*50,cy-Math.sin(ang)*50);g.lineTo(cx+Math.cos(ang)*340,cy+Math.sin(ang)*340);g.stroke();
  g.fillStyle='#B8924A';g.beginPath();g.arc(cx,cy,18,0,6.28);g.fill();g.fillStyle='#070b09';g.beginPath();g.arc(cx,cy,7,0,6.28);g.fill();
  const f1=oc(seg(t,3.0,3.8))*(1-seg(t,6.2,6.8)),f2=oc(seg(t,6.6,7.5))*(1-seg(t,9.2,9.8));
  vis(m1,f1,`translateY(${(1-oc(seg(t,3,3.8)))*30}px)`,(1-oc(seg(t,3,3.8)))*10);vis(m2,f2,`translateY(${(1-oc(seg(t,6.6,7.5)))*30}px)`,(1-oc(seg(t,6.6,7.5)))*10);
  const wf=oc(seg(t,9.6,10.6));vis(wm,wf,`scale(${.9+.1*wf})`,(1-wf)*14);vis(lt,oc(seg(t,10.4,11.2)));vis(cta,oc(seg(t,11.8,12.6)));vis(cr,.45);
  st.style.opacity=seg(t,0,.4)*(1-seg(t,13.5,14));};
}
if(V==='g'){ // GHAYM perfume
 DUR=14;
 const l1=T('غيمة تمرّ…','top:520px;font-family:Amiri;font-weight:700;color:#FFF4DE;text-shadow:0 6px 30px rgba(10,6,30,.9)',150);
 const l2=T('وتبقى.','top:720px;font-family:Amiri;font-weight:700;color:#FFC76A;text-shadow:0 6px 30px rgba(10,6,30,.9)',170);
 const wm=T('غيم','top:560px;font-family:Amiri;font-weight:700;color:#FFF4DE;line-height:1.1',330);
 const lt=T('GHAYM · PARFUMS','top:900px;color:#E8A33D;font-weight:600',50);lt.classList.add('lat');
 const cta=T('جرّب الغيمة','top:1020px;font-family:Plex;font-weight:600;color:#FFF4DE;border:2px solid #E8A33D;display:inline-block;left:50%;right:auto;transform:translateX(-50%);padding:14px 60px;border-radius:999px',46);
 const N=260,B=[];for(let i=0;i<N;i++){const a=-Math.PI/2+(rnd()-.5)*1.3;B.push({b:2.0+rnd()*1.3,a,v:420+rnd()*520,k:1.1+rnd()*.6,r:60+rnd()*90,c:(()=>{const u=rnd();return u<.42?0:u<.88?1:2})(),w:rnd()*6.28,wa:20+rnd()*70,l:7+rnd()*3})}
 const col=[[232,163,61],[120,90,200],[255,244,222]];
 function bottle(t){const x=540,y=1340;g.save();const pulse=seg(t,1.9,2.15)*(1-seg(t,2.15,2.5));
  const bd=g.createLinearGradient(x-150,0,x+150,0);bd.addColorStop(0,'#241a40');bd.addColorStop(.35,'#5a45a0');bd.addColorStop(.55,'#2a1f52');bd.addColorStop(1,'#120c28');
  g.fillStyle=bd;g.strokeStyle='rgba(255,244,222,.35)';g.lineWidth=3;
  const rr=(x0,y0,w,h,r)=>{g.beginPath();g.moveTo(x0+r,y0);g.arcTo(x0+w,y0,x0+w,y0+h,r);g.arcTo(x0+w,y0+h,x0,y0+h,r);g.arcTo(x0,y0+h,x0,y0,r);g.arcTo(x0,y0,x0+w,y0,r);g.closePath()};
  rr(x-150,y,300,360,40);g.fill();g.stroke();
  g.fillStyle='rgba(255,244,222,.18)';rr(x-120,y+24,26,300,13);g.fill();
  g.fillStyle='#E8A33D';rr(x-60,y-70,120,70,12);g.fill();
  g.fillStyle=`rgba(232,163,61,${.8})`;g.fillRect(x-90,y+150,180,3);g.fillStyle='rgba(255,244,222,.8)';g.font='600 40px Corm';g.textAlign='center';g.fillText('GHAYM',x,y+215);
  if(pulse>0){g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,y-70,0,x,y-70,260*pulse+40);gr.addColorStop(0,`rgba(255,235,190,${.8*pulse})`);gr.addColorStop(1,'rgba(255,235,190,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y-70,300,0,6.28);g.fill()}
  g.restore()}
 R=t=>{
  const bg=g.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#0b0820');bg.addColorStop(1,'#1a1030');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  g.save();g.globalCompositeOperation='lighter';
  for(const o of B){const dt=t-o.b;if(dt<0)continue;const d=(1-Math.exp(-o.k*dt))/o.k;const x=540+Math.cos(o.a)*o.v*d+Math.sin(dt*.8+o.w)*o.wa*Math.min(1,dt/2),y=1270+Math.sin(o.a)*o.v*d*1.55-dt*22;
   const r=o.r+170*(1-Math.exp(-dt/1.8));const al=Math.min(1,dt/.6)*Math.max(0,1-dt/o.l)*.05;if(al<=0)continue;const c=col[o.c];const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${al})`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.28);g.fill()}
  g.restore();bottle(t);
  const a1=oc(seg(t,3.8,5.0)),a2=oc(seg(t,5.2,6.4)),o=1-seg(t,8.0,8.8);
  vis(l1,a1*o,`translateY(${(1-a1)*40}px)`,(1-a1)*18);vis(l2,a2*o,`translateY(${(1-a2)*40}px)`,(1-a2)*18);
  const wf=oc(seg(t,8.8,10));vis(wm,wf,`scale(${.92+.08*wf})`,(1-wf)*20);vis(lt,oc(seg(t,9.8,10.8)));vis(cta,oc(seg(t,11.4,12.4)));vis(cr,.45);
  st.style.opacity=seg(t,0,.5)*(1-seg(t,13.5,14));};
}
const st=document.getElementById('st');window.DUR=DUR;window.render=t=>R(t);
</script></body></html>
