<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:700;src:url(fonts/Montserrat-700.ttf)}
@font-face{font-family:Reem;font-weight:700;src:url(fonts/ReemKufi-700.ttf)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/PlexArabic-600.ttf)}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#st{position:absolute;inset:0;overflow:hidden}.p{position:absolute;will-change:transform,opacity}
</style></head><body><div id="st"></div><script>
const V=new URLSearchParams(location.search).get('v');const st=document.getElementById('st');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3),ioc=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,ob=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const E=(h,css)=>{const d=document.createElement('div');d.className='p';d.style.cssText=css;d.innerHTML=h;st.appendChild(d);return d};
let R;
/* ===== scoreboard ===== */
if(V==='s'){st.style.background='#f2ede2';
 E('','inset:0;background-image:linear-gradient(rgba(10,10,10,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(10,10,10,.06) 2px,transparent 2px);background-size:90px 90px');
 const bar=E('<div id="tk" style="white-space:nowrap;font:700 44px Mont;color:#ffd24a;direction:ltr;line-height:100px"></div>','left:0;right:0;top:0;height:100px;background:#0a0a0a;overflow:hidden');
 bar.querySelector('#tk').textContent=('LIVE SCOREBOARD  ·  2 DAYS LATER  ·  YELLOW & BLUE  ·  ').repeat(8);
 const ttl=E('لوحة<br>النتائج','left:0;right:0;top:170px;text-align:center;font:700 160px/1.08 Reem;color:#0a0a0a');
 const sub=E('@yellow.blue.om · بعد يومين من أول رقم','left:0;right:0;top:575px;text-align:center;font:600 46px Plex;color:#0a0a0a;direction:rtl');
 const card=(top,label,from,to,delta,t0)=>{const c=E(`<div style="position:absolute;inset:0;background:#ffd24a;transform:translate(16px,16px)"></div><div style="position:absolute;inset:0;background:#fff;border:6px solid #0a0a0a"></div>
  <div style="position:absolute;right:44px;top:44px;font:700 62px Reem;color:#0a0a0a;direction:rtl">${label}</div>
  <div class="num" style="position:absolute;left:44px;top:60px;font:700 190px/1 Mont;color:#0a0a0a;direction:ltr;letter-spacing:-6px"></div>
  <div class="dl" style="position:absolute;right:44px;bottom:36px;background:#0a0a0a;color:#ffd24a;font:700 52px Mont;padding:6px 28px;direction:ltr;opacity:0">${delta}</div>`,`left:100px;width:880px;top:${top}px;height:330px`);c.dataset.f=from;c.dataset.t=to;c.dataset.t0=t0;return c};
 const cards=[card(650,'المتابعون',248,250,'+2',1.0),card(1020,'أفضل ريل',206,280,'+74',3.6),card(1390,'ريلز منشورة',0,12,'خلال يومين',6.2)];
 const note=E('أرقام حقيقية من إحصائيات الحساب · 4 نوفمبر 2026','left:0;right:0;top:1760px;text-align:center;font:600 34px Plex;color:#0a0a0a;opacity:.7;direction:rtl');
 const end=E(`<div style="position:absolute;inset:0;background:#0a0a0a"></div><div style="position:absolute;left:0;right:0;top:520px;text-align:center;font:700 190px/1.1 Reem;color:#ffd24a;direction:rtl">تابع<br>الرحلة</div><div style="position:absolute;left:0;right:0;top:1100px;text-align:center;font:700 70px Mont;color:#fff;direction:ltr">@yellow.blue.om</div><div style="position:absolute;left:0;right:0;top:1230px;text-align:center;font:600 50px Plex;color:#ffd24a;direction:rtl">الرقم القادم نعرضه بعد أسبوع</div>`,'inset:0');
 R=t=>{st.style.opacity=seg(t,0,.2)*(1-seg(t,13.6,14));
  bar.querySelector('#tk').style.transform=`translateX(${-t*260}px)`;
  const a=oc(seg(t,.2,.9));ttl.style.opacity=a;ttl.style.transform=`translateY(${(1-a)*-50}px)`;sub.style.opacity=oc(seg(t,.6,1.2));
  cards.forEach(c=>{const t0=+c.dataset.t0,k=ob(seg(t,t0-.3,t0+.4));c.style.opacity=seg(t,t0-.3,t0);c.style.transform=`translateX(${(1-k)*(c.dataset.t0%2?-1:1)*900}px)`;
   const p=oc(seg(t,t0+.3,t0+1.9)),v=Math.round(+c.dataset.f+(+c.dataset.t-+c.dataset.f)*p);c.querySelector('.num').textContent=v;
   const d=c.querySelector('.dl');const dk=ob(seg(t,t0+1.9,t0+2.3));d.style.opacity=seg(t,t0+1.9,t0+2.1);d.style.transform=`scale(${.5+.5*dk}) rotate(${-4+4*dk}deg)`});
  note.style.opacity=.7*oc(seg(t,8.9,9.5))*(1-seg(t,10.3,10.6));
  end.style.opacity=seg(t,10.4,11.2);end.style.pointerEvents='none';
 };window.DUR=14;
}
/* ===== 3-second hook ===== */
if(V==='h'){st.style.background='#0a0a0a';
 const top=E(`<div style="position:absolute;inset:0;background:#0a0a0a"></div>
  <div style="position:absolute;right:60px;top:70px;background:#fff;color:#0a0a0a;font:700 44px Reem;padding:6px 30px;direction:rtl">الهوك الضعيف</div>
  <div id="w" style="position:absolute;left:70px;right:70px;top:330px;text-align:center;font:700 100px/1.3 Reem;color:#fff;direction:rtl"></div>
  <div id="x" style="position:absolute;left:0;right:0;top:700px;text-align:center;font:700 120px Mont;color:#ff4d4d;opacity:0">✖</div>`,'left:0;right:0;top:0;height:960px;overflow:hidden');
 const bot=E(`<div style="position:absolute;inset:0;background:#ffd24a"></div>
  <div style="position:absolute;right:60px;top:60px;background:#0a0a0a;color:#ffd24a;font:700 44px Reem;padding:6px 30px;direction:rtl">الهوك القوي</div>
  <div id="s" style="position:absolute;left:60px;right:60px;top:210px;text-align:center;font:700 120px/1.25 Reem;color:#0a0a0a;direction:rtl"></div>
  <div id="k" style="position:absolute;left:0;right:0;top:640px;text-align:center;font:700 120px Mont;color:#0a0a0a;opacity:0">✔</div>`,'left:0;right:0;top:960px;height:960px;overflow:hidden');
 const clock=E('<div id="cn" style="font:700 150px Mont;color:#fff;direction:ltr;text-align:center;line-height:1"></div>','left:390px;width:300px;top:810px;height:300px;border-radius:50%;background:#0a0a0a;border:10px solid #fff;display:flex;align-items:center;justify-content:center');
 const mid=E('','left:0;right:0;top:955px;height:10px;background:#fff');
 const end=E(`<div style="position:absolute;inset:0;background:#ffd24a"></div><div style="position:absolute;left:0;right:0;top:420px;text-align:center;font:700 170px/1.12 Reem;color:#0a0a0a;direction:rtl">ابدأ<br>بالرقم<br>لا بالتحية</div><div style="position:absolute;left:0;right:0;top:1300px;text-align:center;font:700 60px Plex;color:#0a0a0a;direction:rtl">واتساب · <span style="font:700 64px Mont;direction:ltr;display:inline-block">76761808</span></div><div style="position:absolute;left:0;right:0;top:1420px;text-align:center;font:700 58px Mont;color:#0a0a0a;direction:ltr">@yellow.blue.om</div>`,'inset:0');
 const wT='هلا والله، اليوم بتكلم معاكم عن التسويق',sT='أفضل ريل عندنا وصل 280 مشاهدة.';
 R=t=>{st.style.opacity=seg(t,0,.2)*(1-seg(t,13.6,14));
  const a=ob(seg(t,.2,1));top.style.transform=`translateY(${(1-a)*-960}px)`;bot.style.transform=`translateY(${(1-a)*960}px)`;
  // weak phase 1.2-5: type text, countdown 3,2,1 from 1.6 to 4.6, swipe away at 4.6
  const wk=top.querySelector('#w');wk.textContent=wT.slice(0,Math.floor(wT.length*seg(t,1.3,2.8)));
  const ph=t<5.2?'w':'s';
  const cn=document.getElementById('cn');
  if(t<5.2){const r=3-cl((t-1.6)/1,0,3);cn.textContent=t<1.6?'3':Math.max(0,Math.ceil(r));clock.style.opacity=seg(t,1,1.5);clock.style.top='810px'}
  else{const r=3-cl((t-5.9),0,3);cn.textContent=t<5.9?'3':Math.max(0,Math.ceil(r));clock.style.opacity=t<10?1:1-seg(t,10,10.4)}
  const sw=ioc(seg(t,4.6,5.3));top.style.transform=`translateY(${(1-a)*-960-sw*1100}px) rotate(${sw*-6}deg)`;top.style.opacity=1-seg(t,5,5.4);
  top.querySelector('#x').style.opacity=seg(t,4.2,4.6);
  const sk=bot.querySelector('#s');sk.textContent=sT.slice(0,Math.floor(sT.length*seg(t,6.0,7.6)));
  bot.querySelector('#k').style.opacity=seg(t,9.2,9.6);bot.querySelector('#k').style.transform=`scale(${.6+.4*ob(seg(t,9.2,9.7))})`;
  bot.style.transform=`translateY(${(1-a)*960}px)`;mid.style.opacity=t<10?1:0;
  end.style.opacity=seg(t,10.4,11.2);end.style.pointerEvents='none';
 };window.DUR=14;
}
window.render=t=>R(t);
</script></body></html>
