server {
  listen 80;
  client_max_body_size 64m;
  proxy_read_timeout 300s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
  # TLS: terminate with certbot / your load balancer; see docs/DEPLOYMENT.md
}
