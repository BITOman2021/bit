<!doctype html><html lang="ar"><head><meta charset="utf-8"><style>
@font-face{font-family:Reem;font-weight:700;src:url(fonts/ReemKufi-700.ttf)}
@font-face{font-family:Kufi;font-weight:700;src:url(fonts/NotoKufi-700.ttf)}
@font-face{font-family:Mont;font-weight:700;src:url(fonts/Montserrat-700.ttf)}
*{margin:0}html,body{width:1080px;height:1920px;overflow:hidden;background:#0b5fd6}canvas{display:block}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const V=new URLSearchParams(location.search).get('v');
const g=document.getElementById('c').getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const oc=x=>1-Math.pow(1-x,3);
const eb=x=>{const c=1.70158*1.525;x=cl(x);return x<.5?(Math.pow(2*x,2)*((c+1)*2*x-c))/2:(Math.pow(2*x-2,2)*((c+1)*(x*2-2)+c)+2)/2};
const bo=x=>{x=cl(x);const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375};
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function star(x,y,r,rot,col){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2?r*.45:r;g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}g.closePath();g.fill();g.restore()}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.2832);g.fill()}
function txt(s,x,y,size,col,font='Reem',stroke,sw){g.save();g.font=`700 ${size}px ${font}`;g.textAlign='center';g.textBaseline='middle';g.direction='rtl';g.lineJoin='round';if(stroke){g.strokeStyle=stroke;g.lineWidth=sw||size*.18;g.strokeText(s,x,y)}g.fillStyle=col;g.fillText(s,x,y);g.restore()}
const snow=[];for(let i=0;i<90;i++)snow.push({x:rnd()*1080,y:rnd()*1920,r:3+rnd()*8,s:60+rnd()*140,p:rnd()*6.28});
function drawSnow(t,a=1){g.fillStyle=`rgba(255,255,255,${.85*a})`;for(const f of snow){const y=(f.y+t*f.s)%1960-20,x=f.x+Math.sin(t*1.3+f.p)*30;g.beginPath();g.arc(x,y,f.r,0,6.2832);g.fill()}}
// ---------- characters
function jar(x,y,s,fill=.8,tilt=0){g.save();g.translate(x,y);g.rotate(tilt);g.scale(s,s);
 g.fillStyle='#ffb300';rr(-60,-70,120,130,26);g.fill();g.fillStyle='#ffe082';rr(-48,-30+(1-fill)*60,96,80*fill+8,18);g.fill();
 g.fillStyle='#8d5524';rr(-66,-96,132,32,12);g.fill();g.fillStyle='rgba(255,255,255,.55)';rr(-42,-50,14,60,7);g.fill();
 g.fillStyle='#fff8e1';rr(-34,-4,68,40,8);g.fill();txt('عسل',0,16,28,'#8d5524');g.restore()}
function bear(x,y,s,t,o={}){const bl=(t%3.2)<.14?.1:1;const bob=Math.sin(t*4)*6*(o.bob??1);
 g.save();g.translate(x,y+bob);g.scale(s,s);
 const brown='#a8622c',belly='#f1c892';
 // backpack
 g.fillStyle='#1f5fd6';rr(-190,20,110,190,40);g.fill();g.fillStyle='#154aa8';rr(-170,60,70,60,18);g.fill();
 // body
 circ(0,170,190,brown);circ(0,200,120,belly);
 // ears
 for(const sx of[-1,1]){circ(sx*125,-150,56,brown);circ(sx*125,-150,32,'#d99a62')}
 // head
 g.fillStyle=brown;g.beginPath();g.ellipse(0,-50,170,150,0,0,6.2832);g.fill();
 // cap
 g.fillStyle='#2f6fe0';g.beginPath();g.ellipse(0,-150,150,78,0,Math.PI,0);g.fill();rr(-20,-170,200,32,16);g.fillStyle='#1d4fb5';g.fill();
 circ(0,-228,18,'#1d4fb5');g.fillStyle='#ffd400';circ(-8,-170,16,'#ffd400');
 // muzzle
 g.fillStyle=belly;g.beginPath();g.ellipse(0,0,80,62,0,0,6.2832);g.fill();
 circ(0,-22,22,'#3a2312');g.fillStyle='rgba(255,255,255,.5)';circ(-7,-28,6,'rgba(255,255,255,.6)');
 // eyes
 const lx=(o.look||0)*10;
 for(const sx of[-1,1]){g.save();g.translate(sx*62,-62);g.scale(1,bl);circ(0,0,30,'#fff');circ(lx,3,18,'#2b1a0e');circ(lx+5,-3,6,'#fff');g.restore()}
 // mouth
 g.strokeStyle='#3a2312';g.lineWidth=7;g.lineCap='round';g.beginPath();
 if(o.open){g.fillStyle='#7a2b1a';g.ellipse(0,26,34,o.open*30,0,0,3.1416);g.fill()}else{g.arc(0,10,36,.2,2.94);g.stroke()}
 // cheeks
 circ(-100,-8,20,'rgba(255,120,120,.45)');circ(100,-8,20,'rgba(255,120,120,.45)');
 // arms
 for(const sx of[-1,1]){circ(sx*150,190,50,brown)}
 g.restore()}
function boy(x,y,s,t,o={}){const bob=Math.sin(t*5)*5;g.save();g.translate(x,y+bob);g.scale(s,s);
 // dishdasha
 g.fillStyle='#fdfdfd';g.beginPath();g.ellipse(0,250,210,150,0,Math.PI,0);g.fill();g.fillRect(-210,250,420,80);g.fillStyle='#e8e8ee';rr(-24,120,48,210,20);g.fill();
 // neck/face
 g.fillStyle='#e2a46c';rr(-40,100,80,60,20);g.fill();
 g.beginPath();g.ellipse(0,20,135,150,0,0,6.2832);g.fill();
 // ears
 for(const sx of[-1,1])circ(sx*132,30,28,'#d7945a');
 // mussar
 g.fillStyle='#b3202a';g.beginPath();g.ellipse(0,-90,150,100,0,Math.PI,0);g.fill();rr(-150,-100,300,60,26);g.fill();
 g.strokeStyle='#ffd400';g.lineWidth=5;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(i*40,-120);g.lineTo(i*40+20,-60);g.stroke()}
 g.fillStyle='#8f1520';g.beginPath();g.ellipse(70,-120,50,34,.5,0,6.2832);g.fill();
 // eyes
 const bl=(t%3)<.12?.1:1;for(const sx of[-1,1]){g.save();g.translate(sx*50,10);g.scale(1,bl);circ(0,0,26,'#fff');circ(0,3,16,'#2b1a0e');circ(4,-3,5,'#fff');g.restore()}
 g.fillStyle='#4a2a14';g.fillRect(-82,-30,50,8);g.fillRect(32,-30,50,8);
 circ(0,50,12,'#cf8b53');
 g.strokeStyle='#7a2b1a';g.lineWidth=7;g.lineCap='round';g.beginPath();g.arc(0,66,42,.15,3);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(0,70,36,.2,2.94);g.fill();
 circ(-85,62,20,'rgba(255,110,110,.45)');circ(85,62,20,'rgba(255,110,110,.45)');
 // waving hand
 const w=o.wave?Math.sin(t*10)*.35:0;g.save();g.translate(190,200);g.rotate(-1+w);g.fillStyle='#fdfdfd';rr(-30,-20,60,130,28);g.fill();circ(0,-30,40,'#e2a46c');g.restore();
 g.restore()}
function badge(x,y,s,t){ // blue circle logo with stars
 g.save();g.translate(x,y);g.scale(s,s);
 const gr=g.createRadialGradient(0,0,20,0,0,260);gr.addColorStop(0,'#3aa0ff');gr.addColorStop(1,'#0a52c8');g.fillStyle=gr;g.beginPath();g.arc(0,0,260,0,6.2832);g.fill();
 g.lineWidth=12;g.strokeStyle='#fff';g.stroke();
 for(let i=0;i<7;i++){const a=i/7*6.2832+t*.4;star(Math.cos(a)*215,Math.sin(a)*215,26,t+i,'#ffd400')}
 txt('Sam',0,-70,120,'#ffd400','Mont','#0a3a99',16);txt('Kidz',0,50,130,'#ffd400','Mont','#0a3a99',16);txt('سام كيدز',0,150,80,'#fff','Reem','#0a3a99',14);
 g.restore()}
function rays(t,c1,c2){g.save();g.translate(540,860);for(let i=0;i<18;i++){g.rotate(6.2832/18);g.fillStyle=i%2?c1:c2;g.beginPath();g.moveTo(0,0);g.lineTo(2400,-190);g.lineTo(2400,190);g.fill()}g.restore()}
function sub(t,a,sz=1,y=1560){ // subscribe button
 const p=1+.06*Math.sin(t*8);g.save();g.translate(540,y);g.scale(p*sz,p*sz);g.globalAlpha=a;g.fillStyle='#ff2d2d';rr(-300,-70,600,140,70);g.fill();
 g.fillStyle='#fff';g.beginPath();g.moveTo(-220,-30);g.lineTo(-220,30);g.lineTo(-168,0);g.fill();txt('اشترك',60,2,76,'#fff');g.restore()}
// ---------- videos
const VID={
 honey:{DUR:7,draw(t){
  const bg=g.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#ffb88c');bg.addColorStop(.55,'#8fb8ff');bg.addColorStop(1,'#e8f3ff');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  circ(780,420,190,'rgba(255,240,200,.9)');
  g.fillStyle='#fff';g.beginPath();g.moveTo(0,1500);for(let x=0;x<=1080;x+=60)g.lineTo(x,1450+Math.sin(x*.01)*40);g.lineTo(1080,1920);g.lineTo(0,1920);g.fill();
  drawSnow(t);
  const up=eb(seg(t,.2,1.4));const by=1500-up*430;
  bear(540,by,1.55,t,{look:Math.sin(t*2),open:t>2.4&&t<4?.5+.5*Math.sin(t*9):0});
  const tilt=-.15+Math.sin(t*3)*.12;jar(760,by+250,1.6,.9-seg(t,2,5)*.4,tilt);
  // drip
  if(t>1.8){const d=(t*1.2)%1;circ(790,by+330+d*180,14*(1-d*.3),'#ffb300')}
  // thought ?
  const q=bo(seg(t,2.2,3));g.save();g.translate(250,520);g.scale(q,q);g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,120,95,0,0,6.2832);g.fill();circ(70,130,22,'#fff');circ(110,175,13,'#fff');txt('؟',0,8,140,'#2f6fe0');g.restore();
  const s1='بيرو عنده عسل كثير…';txt(s1.slice(0,Math.floor(s1.length*seg(t,.8,2.2))),540,230,86,'#fff','Reem','#2f6fe0',22);
  g.globalAlpha=oc(seg(t,3.6,4.4));txt('فهل قال الحقيقة لأصدقائه؟',540,350,70,'#ffd400','Reem','#2f6fe0',20);g.globalAlpha=1;
  const e=oc(seg(t,5.4,6.1));if(e>0){g.fillStyle=`rgba(10,82,200,${e*.94})`;g.fillRect(0,0,1080,1920);badge(540,780,.95*bo(seg(t,5.5,6.4)),t);txt('شاهد القصة على القناة',540,1230,66,'#fff','Reem');sub(t,e)}}},
 wave:{DUR:6,draw(t){
  g.fillStyle='#0a52c8';g.fillRect(0,0,1080,1920);rays(t,'#1a74ff','#0a52c8');
  const sc=eb(seg(t,.2,1.1));
  for(let i=0;i<16;i++){const a=i*.9+t*.5,r=300+((t*180+i*70)%700);star(540+Math.cos(a)*r,860+Math.sin(a)*r*.9,16+((i*7)%22),t*2+i,i%2?'#ffd400':'#fff')}
  g.save();g.translate(540,1000);g.scale(sc*1.45,sc*1.45);boy(0,0,1,t,{wave:t>1.1});g.restore();
  const b=bo(seg(t,1.5,2.5));g.save();g.translate(540,330);g.scale(b,b);txt('سام كيدز',0,0,190,'#ffd400','Reem','#0a3a99',28);g.restore();
  g.globalAlpha=oc(seg(t,2.6,3.4));txt('مغامرات · قصص · أناشيد',540,1545,70,'#fff','Reem','#0a3a99',16);g.globalAlpha=1;
  sub(t,oc(seg(t,3.6,4.2)),1,1710)}},
 guess:{DUR:6.5,draw(t){
  const bg=g.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#1a2a6c');bg.addColorStop(1,'#4a90e2');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  for(let i=0;i<30;i++)star((i*97)%1080,(i*211)%900,6+(i%4)*3,t+i,`rgba(255,255,255,${.4+.4*Math.sin(t*3+i)})`);
  drawSnow(t,.6);
  txt('أين العسل؟',540,260,150,'#ffd400','Reem','#0a3a99',26);
  // shelf
  g.fillStyle='#7a4a24';rr(60,1240,960,50,14);g.fill();
  const pick=t>4.2?1:-1;
  for(let i=0;i<3;i++){const x=240+i*300;const shake=(i===1&&t>2.2&&t<4.2)?Math.sin(t*40)*8:0;const jump=(i===1&&t>4.2)?-Math.abs(Math.sin((t-4.2)*8))*60*(1-seg(t,4.2,5.4)):0;jar(x+shake,1180+jump,1.5,.9)}
  const look=t<2.2?Math.sin(t*3):(t<4.2?-1:1);
  bear(540,1560,1.15,t,{look:look,open:t>4.2?.7:0});
  g.save();const q=bo(seg(t,.8,1.6));g.translate(540,560);g.scale(q,q);txt('؟  ؟  ؟',0,0,160,'#fff','Reem');g.restore();
  const e=oc(seg(t,5.3,6));g.globalAlpha=e;g.fillStyle='rgba(10,82,200,.9)';g.fillRect(0,650,1080,200);txt('اكتشف السر على قناة Sam Kidz',540,750,66,'#fff','Reem');g.globalAlpha=1}},
};
let P=null,pr=false;
function prep(){ // particle title for 'snowtext'
 const c=document.createElement('canvas');c.width=1080;c.height=700;const x=c.getContext('2d');x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='700 300px Reem';x.fillText('سام',540,200);x.font='700 190px Mont';x.fillText('Sam Kidz',540,480);
 const d=x.getImageData(0,0,1080,700).data;P=[];const cols=['#ffd400','#ffffff','#7fd0ff','#ff6f91','#9cff7a'];
 for(let y=0;y<700;y+=6)for(let xx=0;xx<1080;xx+=6)if(d[(y*1080+xx)*4+3]>128){const a=rnd()*6.28;P.push({tx:xx,ty:y+330,sx:rnd()*1080,sy:-100-rnd()*1200,d:rnd()*1.6,c:cols[Math.floor(rnd()*cols.length)],r:3+rnd()*3,ph:rnd()*6.28})}
 pr=true}
VID.snowtext={DUR:6,draw(t){
  if(!pr)prep();
  const bg=g.createLinearGradient(0,0,0,1920);bg.addColorStop(0,'#0a52c8');bg.addColorStop(1,'#06308a');g.fillStyle=bg;g.fillRect(0,0,1080,1920);
  for(const p of P){const k=oc(seg(t,.2+p.d*.8,2.4+p.d));const x=p.sx+(p.tx-p.sx)*k+Math.sin(t*3+p.ph)*(1-k)*40,y=p.sy+(p.ty-p.sy)*k;g.fillStyle=p.c;g.beginPath();g.arc(x,y,p.r*(1+.4*Math.max(0,Math.sin(t*5+p.ph))*k),0,6.2832);g.fill()}
  const b=bo(seg(t,2.8,3.8));
  g.save();g.translate(290,1450);g.scale(b*.7,b*.7);bear(0,0,1,t,{open:.4});g.restore();
  g.save();g.translate(790,1420);g.scale(b*.8,b*.8);boy(0,0,.9,t,{wave:true});g.restore();
  g.globalAlpha=oc(seg(t,3.8,4.6));txt('قصص · أناشيد · مغامرات',540,1150,70,'#fff','Reem','#0a3a99',16);g.globalAlpha=1;
  sub(t,oc(seg(t,4.4,5)),.8,1790)}};
window.DUR=VID[V].DUR;
window.render=t=>{g.setTransform(1,0,0,1,0,0);VID[V].draw(t);const f=seg(t,0,.2)*(1-seg(t,VID[V].DUR-.25,VID[V].DUR));g.fillStyle=`rgba(0,0,0,${1-f})`;g.fillRect(0,0,1080,1920)};
</script></body></html>
